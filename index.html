<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>SabkaLoan | Modern Theme</title>
    <style> 
        :root {
            --primary-blue: #1A365D;
            --accent-pink: #FF69B4;
            --soft-bg: #FFFFFF;
            --glow-blue: rgba(26, 54, 93, 0.1);
            --glow-pink: rgba(255, 105, 180, 0.1);
        } 
 
        body {
            font-family: 'Inter', sans-serif;
            background: var(--soft-bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        } 
 
        /* The "Curves" from your image recreated in code */
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%; 
            filter: blur(80px);
            z-index: -1;
        } 
        .blue-glow { top: -10%; left: -10%; background: var(--glow-blue); }
        .pink-glow { bottom: -10%; right: -10%; background: var(--glow-pink); }
 
        .container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px); /* This creates the "Glass" look */
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        } 
 
        h1 { color: var(--primary-blue); font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #555; font-size: 1.1rem; margin-bottom: 30px; }
 
        .apply-btn {
            background: var(--accent-pink);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
        } 
 
        .apply-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.6);
        } 
    </style>
</head>
<body>
    <div class="bg-glow blue-glow"></div>
    <div class="bg-glow pink-glow"></div>
 
    <div class="container">
        <h1>SabkaLoan</h1>
        <p>Instant Personal Loans up to ₹1,00,000.<br>100% Digital. Disbursed in 30 Minutes.</p>
        <button class="apply-btn">APPLY NOW</button>
    </div>
</body> 
</html>
