<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SabkaLoan | Instant Digital Loans</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
/* --- Brand Colors & Variables --- */
:root {
    --bg-white: #FFFFFF;
    --light-blue: #F0F7FF;
    --primary-blue: #0066FF;
    --accent-pink: #FF4D94;
    --text-dark: #1A202C;
    --text-muted: #718096;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-white);
    color: var(--text-dark);
    overflow-x: hidden;
    position: relative;
}

/* --- Navigation --- */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 8%;
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 24px;
    font-weight: 800;
    color: var(--primary-blue);
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 30px;
}

.nav-links li {
    font-weight: 600;
    cursor: pointer;
    color: var(--text-muted);
    transition: 0.3s;
}

.nav-links li:hover {
    color: var(--accent-pink);
}

.nav-btn {
    background: var(--primary-blue);
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
}

/* --- Hero Section --- */
.hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 100px 8%;
    min-height: 80vh;
}

.hero-content {
    max-width: 50%;
}

.hero-content h1 {
    font-size: 56px;
    line-height: 1.2;
    margin-bottom: 20px;
}

.highlight {
    color: var(--primary-blue);
    background: linear-gradient(120deg, #e0f0ff 0%, #ffe0f0 100%);
    padding: 0 10px;
}

.hero-content p {
    font-size: 18px;
    color: var(--text-muted);
    margin-bottom: 40px;
}

/* --- Buttons --- */
.primary-btn {
    background: var(--accent-pink);
    color: white;
    padding: 15px 35px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(255, 77, 148, 0.3);
    margin-right: 15px;
}

.secondary-btn {
    background: transparent;
    border: 2px solid var(--primary-blue);
    color: var(--primary-blue);
    padding: 15px 35px;
    border-radius: 12px;
    font-weight: 700;
}

/* --- The Glass Form --- */
.hero-form {
    background: #FFFFFF;
    padding: 40px;
    border-radius: 24px;
    box-shadow: 0 20px 40px rgba(0, 102, 255, 0.1);
    width: 400px;
    border: 1px solid var(--light-blue);
}

.hero-form h3 {
    margin-bottom: 25px;
    color: var(--primary-blue);
}

input[type="text"], input[type="email"], input[type="tel"] {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #E2E8F0;
    border-radius: 8px;
    background: var(--light-blue);
}

.form-btn {
    width: 100%;
    background: var(--primary-blue);
    color: white;
    padding: 15px;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    margin-top: 10px;
}

/* --- Background Blobs --- */
.blob {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    filter: blur(80px);
    z-index: -1;
    opacity: 0.2;
}

.pink-blob {
    background: var(--accent-pink);
    top: -100px;
    right: -100px;
}

.blue-blob {
    background: var(--primary-blue);
    bottom: -100px;
    left: -100px;
}
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">SabkaLoan</div>
        <ul class="nav-links">
            <li>Home</li>
            <li>About Us</li>
            <li>Products</li>
            <li>Repay Loan</li>
            <li>Contact Us</li>
        </ul>
        <button class="nav-btn">Download App</button>
    </nav>

    <main class="hero">
        <div class="hero-content">
            <h1>Sabka Loan <span class="highlight">Aapki Sabhi</span> Jaruraton ke Liye</h1>
            <p>100% Digital Process. Disbursal in 30 Minutes. RBI Registered NBFC.</p>
            <div class="cta-buttons">
                <button class="primary-btn">Apply Now</button>
                <button class="secondary-btn">Check Eligibility</button>
            </div>
        </div>

        <div class="hero-form">
            <h3>Check Loan Offer</h3>
            <input type="text" placeholder="Full Name">
            <input type="email" placeholder="Email Address">
            <input type="tel" placeholder="Phone Number">
            <div class="slider-container">
                <label>Loan Amount: <span id="amount">₹ 10,000</span></label>
                <input type="range" min="1000" max="100000" value="10000" class="slider" id="loan-amount">
            </div>
            <button class="form-btn">Check Offer</button>
            <div id="emi-result"></div>
        </div>
    </main>

    <div class="blob pink-blob"></div>
    <div class="blob blue-blob"></div>

    <script>
// 1. EMI Calculator Logic
const slider = document.getElementById('loan-amount');
const amountDisplay = document.getElementById('amount');
const emiResult = document.getElementById('emi-result');

slider.oninput = function() {
    let val = this.value;
    amountDisplay.innerHTML = parseInt(val).toLocaleString('en-IN');

    // Simple logic: EMI = (Amount / 12) + 15% interest
    let monthlyBase = val / 12;
    let interest = monthlyBase * 0.15;
    let finalEmi = Math.round(monthlyBase + interest);

    emiResult.innerHTML = "₹ " + finalEmi.toLocaleString('en-IN');
};

// 2. Smooth Scroll for Nav Links
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function (e) {
        e.preventDefault();
        document.querySelector(this.getAttribute('href')).scrollIntoView({
            behavior: 'smooth'
        });
    });
});
    </script>
</body>
</html>
